<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Tic-Tac-Toe: PWA Edition</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#02040a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-color: #02040a;
            --glass-bg: rgba(6, 10, 23, 0.9);
            --neon-x: #00f2ff;
            --neon-o: #ff007f;
            --neon-win: #39ff14;
            --text-main: #e2e8f0;
            --border-glow: rgba(0, 242, 255, 0.15);
            --grid-color: rgba(0, 242, 255, 0.05);
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        body.light-mode {
            --bg-color: #e2e8f0; /* Darker grey background */
            --glass-bg: #ffffff; /* Solid white for board */
            --neon-x: #0369a1;
            --neon-o: #be123c;
            --neon-win: #166534;
            --text-main: #0f172a;
            --border-glow: #cbd5e1;
            --grid-color: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
            transition: background-color 0.4s, color 0.4s;
        }

        /* Dynamic Background */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 200%; height: 200%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(500px) rotateX(60deg) translateY(-50%);
            animation: gridMove 20s linear infinite;
            z-index: -1; pointer-events: none;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
        #theme-btn {
            font-size: 0.7rem;
            opacity: 1;
            border-color: var(--border-glow);
            color: var(--text-main);
            background: var(--glass-bg);
        }
        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(-50%) translateZ(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(-50%) translateZ(50px); }
        }

        /* Glitch Effect */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }
        .glitch-effect { animation: glitch 0.2s cubic-bezier(.25,.46,.45,.94) both 3; }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            background: var(--glass-bg);
            padding: 1rem 1.5rem;
            border-radius: 15px;
            border: 2px solid var(--border-glow);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            z-index: 5;
        }
        .score-item { text-align: center; cursor: pointer; }
        .score-label { font-family: var(--font-display); font-size: 0.65rem; color: #64748b; margin-bottom: 0.3rem; letter-spacing: 2px; }
        .score-value { font-size: 1.5rem; font-weight: 700; font-family: var(--font-display); }
        #score-x { color: var(--neon-x); text-shadow: none; }
        #score-o { color: var(--neon-o); text-shadow: none; }
        body:not(.light-mode) #score-x { text-shadow: 0 0 10px var(--neon-x); }
        body:not(.light-mode) #score-o { text-shadow: 0 0 10px var(--neon-o); }

        /* Name Editor */
        #name-input-container {
            display: none;
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: var(--glass-bg);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid var(--neon-x);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        #name-edit {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--neon-x);
            color: var(--text-main);
            font-family: var(--font-display);
            outline: none;
            text-align: center;
        }

        .difficulty-container { margin-bottom: 1rem; display: flex; align-items: center; gap: 1rem; z-index: 5; }
        select { background: var(--glass-bg); color: var(--text-main); border: 2px solid var(--border-glow); padding: 5px 15px; border-radius: 5px; font-family: var(--font-display); outline: none; cursor: pointer; font-size: 0.75rem; }

        #status { font-family: var(--font-display); font-size: 0.9rem; margin-bottom: 1.5rem; letter-spacing: 3px; height: 1.2rem; z-index: 5; text-transform: uppercase; }

        /* Board Container */
        .board-wrapper { position: relative; z-index: 5; }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr); 
            gap: 12px;
            padding: 12px;
            background: var(--glass-bg);
            border-radius: 20px;
            border: 2px solid var(--neon-x);
            width: 90vw;
            max-width: 380px;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.15);
        }
        .cell {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-size: 3rem;
            transition: all 0.2s ease; 
            border: 1px solid rgba(0, 242, 255, 0.3);
            width: 100%;
            height: 100%;
            overflow: hidden;
            line-height: 1; /* Helps with vertical centering */
        }
        body.light-mode .cell {
            background: #f1f5f9; /* Distinct cell color */
            border: 2px solid #cbd5e1; /* Clear visible borders */
        }
        .cell:hover:not(.occupied) { 
            background: rgba(0, 242, 255, 0.15); 
            border-color: var(--neon-x);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            transform: translateY(-2px);
        }
        body.light-mode .cell:hover:not(.occupied) { 
            background: #cbd5e1; 
            border-color: #94a3b8; 
            transform: none;
            box-shadow: none;
        }
        .cell.x { color: var(--neon-x); }
        .cell.o { color: var(--neon-o); }
        body:not(.light-mode) .cell.x { text-shadow: 0 0 10px var(--neon-x); }
        body:not(.light-mode) .cell.o { text-shadow: 0 0 10px var(--neon-o); }
        .cell.x { color: var(--neon-x); text-shadow: 0 0 10px var(--neon-x); }
        .cell.o { color: var(--neon-o); text-shadow: 0 0 10px var(--neon-o); }

        /* Win Line SVG */
        #win-line-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        #win-path {
            stroke: var(--neon-win); stroke-width: 8; stroke-linecap: round; fill: none;
            filter: drop-shadow(0 0 10px var(--neon-win));
            stroke-dasharray: 1000; stroke-dashoffset: 1000;
            transition: stroke-dashoffset 0.5s ease-out;
        }

        /* Controls */
        .controls { margin-top: 2rem; display: flex; gap: 1rem; z-index: 5; }
        button { padding: 8px 16px; background: transparent; border: 1px solid rgba(226, 232, 240, 0.4); color: var(--text-main); font-family: var(--font-display); font-size: 0.75rem; border-radius: 8px; cursor: pointer; transition: all 0.3s; letter-spacing: 2px; }
        button:hover { background: var(--text-main); color: var(--bg-color); box-shadow: 0 0 15px white; }

        /* Match Log */
        .log-container {
            margin-top: 2rem;
            width: 90vw;
            max-width: 380px;
            background: var(--glass-bg);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid var(--border-glow);
            z-index: 5;
        }
        .log-title { font-family: var(--font-display); font-size: 0.7rem; color: #64748b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .log-list { list-style: none; font-size: 0.8rem; font-family: var(--font-display); opacity: 0.8; }
        .log-item { margin-bottom: 5px; display: flex; justify-content: space-between; }
        .log-win { color: var(--neon-win); }
        .log-loss { color: var(--neon-o); }

        @media (max-width: 400px) {
            .cell { font-size: 2rem; }
            .scoreboard { gap: 0.8rem; padding: 0.8rem 1rem; }
        }
    </style>
</head>
<body id="game-body">

    <div class="theme-toggle">
        <button id="theme-btn">THEME: DARK</button>
    </div>

    <div class="bg-grid"></div>

    <div class="scoreboard">
        <div class="score-item" id="player-x-item">
            <div class="score-label" id="label-x">USER_X (Click to Edit)</div>
            <div id="score-x" class="score-value">0</div>
            <div id="name-input-container">
                <input type="text" id="name-edit" maxlength="10" placeholder="NAME_INPUT">
            </div>
        </div>
        <div class="score-item">
            <div class="score-label">SYSTEM_O</div>
            <div id="score-o" class="score-value">0</div>
        </div>
        <div class="score-item">
            <div class="score-label">DRAW</div>
            <div id="score-draws" class="score-value" style="color: #64748b;">0</div>
        </div>
    </div>

    <div class="difficulty-container">
        <select id="difficulty-select">
            <option value="easy">EASY_MODE</option>
            <option value="normal">NORMAL_MODE</option>
            <option value="god">GOD_MODE</option>
        </select>
    </div>

    <div id="status">INIT_COMPLETE</div>

    <div class="board-wrapper">
        <div class="board" id="board"></div>
        <svg id="win-line-svg">
            <line id="win-path" x1="0" y1="0" x2="0" y2="0" />
        </svg>
    </div>

    <div class="controls">
        <button id="reset-game-btn">REBOOT</button>
        <button id="reset-score-btn" style="opacity: 0.4;">WIPE</button>
    </div>

    <div class="log-container">
        <div class="log-title">MATCH_LOG_HISTORY</div>
        <ul id="log-list" class="log-list">
            <!-- Entries added by JS -->
        </ul>
    </div>

    <script>
        const board = document.getElementById('board');
        const statusText = document.getElementById('status');
        const resetGameBtn = document.getElementById('reset-game-btn');
        const resetScoreBtn = document.getElementById('reset-score-btn');
        const scoreXText = document.getElementById('score-x');
        const scoreOText = document.getElementById('score-o');
        const scoreDrawsText = document.getElementById('score-draws');
        const difficultySelect = document.getElementById('difficulty-select');
        const gameBody = document.getElementById('game-body');
        const winPath = document.getElementById('win-path');
        const labelX = document.getElementById('label-x');
        const playerXItem = document.getElementById('player-x-item');
        const nameInputContainer = document.getElementById('name-input-container');
        const nameEditInput = document.getElementById('name-edit');
        const logList = document.getElementById('log-list');
        const themeBtn = document.getElementById('theme-btn');

        let currentPlayer = 'X';
        let gameState = Array(9).fill('');
        let gameActive = true;
        
        // Persistent Data
        let appData = {
            scores: { X: 0, O: 0, draws: 0 },
            userName: "USER_X",
            history: [],
            theme: "dark"
        };

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        // --- Persistence Logic ---
        function loadData() {
            const saved = localStorage.getItem('cyberpunk_ttt_v1');
            if (saved) {
                appData = JSON.parse(saved);
                updateScoreboardUI();
                labelX.innerText = appData.userName;
                renderHistory();
                applyTheme();
            }
        }

        function saveData() {
            localStorage.setItem('cyberpunk_ttt_v1', JSON.stringify(appData));
        }

        function toggleTheme() {
            appData.theme = appData.theme === 'dark' ? 'light' : 'dark';
            applyTheme();
            saveData();
        }

        function applyTheme() {
            if (appData.theme === 'light') {
                document.body.classList.add('light-mode');
                themeBtn.innerText = 'THEME: LIGHT';
            } else {
                document.body.classList.remove('light-mode');
                themeBtn.innerText = 'THEME: DARK';
            }
        }

        themeBtn.addEventListener('click', toggleTheme);

        // --- Audio System ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration, vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }
        const sounds = {
            click: () => playSound(400, 'sine', 0.1, 0.1),
            aiMove: () => playSound(200, 'square', 0.15, 0.05),
            win: () => { playSound(500, 'sawtooth', 0.3, 0.1); setTimeout(() => playSound(650, 'sawtooth', 0.5, 0.1), 100); },
            draw: () => playSound(150, 'triangle', 0.4, 0.1),
            reset: () => playSound(800, 'sine', 0.5, 0.1)
        };

        // --- Game Core ---
        function initBoard() {
            board.innerHTML = '';
            winPath.setAttribute('stroke-dashoffset', '1000');
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.setAttribute('data-index', i);
                cell.addEventListener('click', () => handleCellClick(cell, i));
                board.appendChild(cell);
            }
            updateStatusUI();
        }

        function handleCellClick(cell, index) {
            if (gameState[index] !== '' || !gameActive || currentPlayer !== 'X') return;
            sounds.click();
            makeMove(index);
        }

        function makeMove(index) {
            gameState[index] = currentPlayer;
            const cells = document.querySelectorAll('.cell');
            cells[index].classList.add('occupied', currentPlayer.toLowerCase());
            cells[index].innerHTML = `<span>${currentPlayer}</span>`;

            if (checkResult()) return;

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateStatusUI();

            if (currentPlayer === 'O' && gameActive) {
                statusText.innerText = "SYS_THINKING...";
                setTimeout(aiMove, 600);
            }
        }

        function aiMove() {
            const difficulty = difficultySelect.value;
            let moveIndex;
            if (difficulty === 'easy') {
                const empty = gameState.map((v, i) => v === '' ? i : null).filter(v => v !== null);
                moveIndex = empty[Math.floor(Math.random() * empty.length)];
            } else if (difficulty === 'normal') {
                // 50% chance for best move, 50% chance for random move
                if (Math.random() > 0.5) {
                    moveIndex = getBestMove();
                } else {
                    const empty = gameState.map((v, i) => v === '' ? i : null).filter(v => v !== null);
                    moveIndex = empty[Math.floor(Math.random() * empty.length)];
                }
            } else {
                moveIndex = getBestMove();
            }
            if (moveIndex !== undefined) { sounds.aiMove(); makeMove(moveIndex); }
        }

        function getBestMove() {
            let bestScore = -Infinity; let move;
            for (let i = 0; i < 9; i++) {
                if (gameState[i] === '') {
                    gameState[i] = 'O';
                    let score = minimax(gameState, 0, false);
                    gameState[i] = '';
                    if (score > bestScore) { bestScore = score; move = i; }
                }
            }
            return move;
        }

        function minimax(board, depth, isMax) {
            let res = checkWinnerRaw();
            if (res === 'O') return 10;
            if (res === 'X') return -10;
            if (res === 'draw') return 0;
            if (isMax) {
                let best = -Infinity;
                for (let i = 0; i < 9; i++) { if (board[i] === '') { board[i] = 'O'; best = Math.max(best, minimax(board, depth + 1, false)); board[i] = ''; } }
                return best;
            } else {
                let best = Infinity;
                for (let i = 0; i < 9; i++) { if (board[i] === '') { board[i] = 'X'; best = Math.min(best, minimax(board, depth + 1, true)); board[i] = ''; } }
                return best;
            }
        }

        function checkWinnerRaw() {
            for (let c of winConditions) { if (gameState[c[0]] && gameState[c[0]] === gameState[c[1]] && gameState[c[0]] === gameState[c[2]]) return gameState[c[0]]; }
            return !gameState.includes('') ? 'draw' : null;
        }

        function checkResult() {
            let winner = checkWinnerRaw();
            if (winner) {
                gameActive = false;
                let outcome = "";
                if (winner === 'draw') {
                    appData.scores.draws++;
                    statusText.innerText = "STALEMATE_SYNC";
                    sounds.draw();
                    outcome = "DRAW";
                } else {
                    appData.scores[winner]++;
                    statusText.innerText = `WIN_DETECTED: ${winner === 'X' ? appData.userName : 'SYSTEM'}`;
                    statusText.style.color = winner === 'X' ? 'var(--neon-x)' : 'var(--neon-o)';
                    sounds.win();
                    drawWinLine(winner);
                    triggerGlitch();
                    outcome = winner === 'X' ? `${appData.userName} WON` : "SYSTEM WON";
                }
                addToHistory(outcome);
                updateScoreboardUI();
                saveData();
                return true;
            }
            return false;
        }

        function addToHistory(text) {
            appData.history.unshift(text);
            if (appData.history.length > 5) appData.history.pop();
            renderHistory();
        }

        function renderHistory() {
            logList.innerHTML = appData.history.map((entry, i) => `
                <li class="log-item">
                    <span>MATCH_${appData.history.length - i}</span>
                    <span class="${entry.includes('WON') ? (entry.includes('SYSTEM') ? 'log-loss' : 'log-win') : ''}">${entry}</span>
                </li>
            `).join('');
        }

        function triggerGlitch() { gameBody.classList.add('glitch-effect'); setTimeout(() => gameBody.classList.remove('glitch-effect'), 600); }

        function drawWinLine(winner) {
            let line;
            for (let c of winConditions) { if (gameState[c[0]] === winner && gameState[c[1]] === winner && gameState[c[2]] === winner) { line = c; break; } }
            const cells = document.querySelectorAll('.cell');
            const startRect = cells[line[0]].getBoundingClientRect();
            const endRect = cells[line[2]].getBoundingClientRect();
            const boardRect = board.getBoundingClientRect();
            const x1 = (startRect.left + startRect.width / 2) - boardRect.left;
            const y1 = (startRect.top + startRect.height / 2) - boardRect.top;
            const x2 = (endRect.left + endRect.width / 2) - boardRect.left;
            const y2 = (endRect.top + endRect.height / 2) - boardRect.top;
            winPath.setAttribute('x1', x1); winPath.setAttribute('y1', y1); winPath.setAttribute('x2', x2); winPath.setAttribute('y2', y2);
            winPath.setAttribute('stroke-dashoffset', '0');
        }

        function updateStatusUI() {
            statusText.innerText = currentPlayer === 'X' ? `WAITING_FOR_${appData.userName}` : 'SYNCING_SYSTEM';
            statusText.style.color = currentPlayer === 'X' ? 'var(--neon-x)' : 'var(--neon-o)';
        }

        function updateScoreboardUI() {
            scoreXText.innerText = appData.scores.X;
            scoreOText.innerText = appData.scores.O;
            scoreDrawsText.innerText = appData.scores.draws;
        }

        function resetGame() {
            sounds.reset(); gameState = Array(9).fill(''); gameActive = true; currentPlayer = 'X'; initBoard();
        }

        // --- Customization Logic ---
        playerXItem.addEventListener('click', () => {
            nameInputContainer.style.display = 'block';
            nameEditInput.value = appData.userName;
            nameEditInput.focus();
        });

        nameEditInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const val = nameEditInput.value.trim().toUpperCase();
                if (val) {
                    appData.userName = val;
                    labelX.innerText = val;
                    saveData();
                    updateStatusUI();
                }
                nameInputContainer.style.display = 'none';
            }
        });

        document.addEventListener('click', (e) => {
            if (!playerXItem.contains(e.target)) nameInputContainer.style.display = 'none';
        }, true);

        resetGameBtn.addEventListener('click', resetGame);
        resetScoreBtn.addEventListener('click', () => {
            appData.scores = { X: 0, O: 0, draws: 0 };
            appData.history = [];
            updateScoreboardUI();
            renderHistory();
            saveData();
            resetGame();
        });

        // Initialize
        loadData();
        initBoard();

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW fail', err));
            });
        }
    </script>
</body>
</html>
